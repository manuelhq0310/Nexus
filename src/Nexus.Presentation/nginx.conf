server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 1. INCLUYE LOS TIPOS MIME POR DEFECTO DEL SISTEMA OPERATIVO
    include /etc/nginx/mime.types;

    # Asegura el MIME type correcto para los binarios WebAssembly.
    types {
        application/wasm wasm;
    }

    # IMPORTANTE: Blazor WebAssembly "standalone" (este proyecto) NO agrega un hash de
    # contenido al nombre de los archivos .dll/.wasm (a diferencia de bundlers JS típicos).
    # Cachear estos archivos como "immutable"/larga duración es un error: el navegador
    # seguiría sirviendo la versión vieja desde caché aunque reconstruyas y despliegues
    # una imagen nueva, hasta que el usuario limpie caché manualmente. Se usa "no-cache"
    # (no "no-store"): el navegador SÍ puede cachear, pero primero revalida con el
    # servidor (ETag/Last-Modified, que Nginx ya envía por defecto) en cada carga; si el
    # contenido no cambió, el servidor responde 304 y no hay que retransferir el archivo.
    location ~* \.(?:dll|wasm|pdb|blat|dat)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # appsettings.json se genera en cada arranque del contenedor (ver
    # docker-entrypoint.sh): nunca debe cachearse.
    location = /appsettings.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Fallback de SPA: cualquier ruta que no sea un archivo real se resuelve
    # contra index.html, para que el Router de Blazor la maneje del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream text/javascript application/javascript text/css application/json;
    gzip_min_length 1024;
}
