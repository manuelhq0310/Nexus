services:
  nexus.api:
    build:
      context: .
      dockerfile: src/Nexus.Api/Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Cadena de conexión completa a tu base de datos PostgreSQL en la nube
      # (Azure Database for PostgreSQL, AWS RDS, Supabase, Neon, Render, etc.).
      # Ver .env.example para el formato exacto. Si usas el overlay opcional
      # docker-compose.local-db.yml, este valor queda sobrescrito por ese archivo
      # y no necesitas definir NEXUS_DB_CONNECTION_STRING en tu .env.
      ConnectionStrings__NexusDB: "Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=Fanalca2026*"
      JwtSettings__Secret: "kUb0z1CdcrsnHixRBsNbqS2Df6L5ayJH"
      JwtSettings__Issuer: "Nexus.Api"
      JwtSettings__Audience: "Nexus.Clients"
      JwtSettings__ExpiryMinutes: 60
      RabbitMQ__Host: "172.30.2.203"
      RabbitMQ__Port: 5672
      RabbitMQ__Username: "girsys"
      RabbitMQ__Password: "Girsys2024++"
      RabbitMQ__VirtualHost: "/"
      # Aplica migraciones de EF Core automáticamente al arrancar el contenedor.
      # Desactívalo (false) si prefieres correr `dotnet ef database update` tú mismo,
      # o si vas a correr varias réplicas de este contenedor a la vez (ver DOCKER.md).
      RUN_MIGRATIONS_ON_STARTUP: true
    ports:
      - "5100:8080"

  nexus.presentation:
    build:
      context: .
      dockerfile: src/Nexus.Presentation/Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    depends_on:
      - nexus.api
    environment:
      # URL con la que el NAVEGADOR del usuario alcanza al backend (no el nombre
      # interno "nexus.api" de la red de Docker, que no es accesible desde fuera).
      API_BASE_URL: "http://localhost:5100"
    ports:
      - "5250:80"

  postgres:
    image: postgres:16-alpine
    container_name: integraciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "Fanalca2026*"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
